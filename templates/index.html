<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <title>KYRO — Personal AI</title>
  <style>
    :root{
      --bg:#070708;--panel:#101012;--panel2:#0c0c0f;--border:rgba(255,255,255,.08);
      --text:#f7f7f8;--muted:#8d8d96;--user:#f4f4f5;--userText:#080809;--kyro:#151519;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:radial-gradient(circle at 55% -10%,rgba(255,255,255,.08),transparent 34%),var(--bg);
      color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    .shell{width:min(1280px,97vw);height:min(900px,94vh);margin:3vh auto;display:flex;overflow:hidden;
      border:1px solid var(--border);border-radius:26px;background:rgba(14,14,17,.9);
      box-shadow:0 30px 100px rgba(0,0,0,.55);backdrop-filter:blur(22px)}
    .sidebar{width:255px;flex:0 0 255px;padding:14px;display:flex;flex-direction:column;
      background:rgba(9,9,11,.85);border-right:1px solid var(--border)}
    .new-chat{width:100%;height:44px;border:1px solid var(--border);border-radius:13px;background:#fff;color:#000;font-weight:850;
      transition:.18s ease;display:flex;align-items:center;justify-content:center;gap:8px}
    .new-chat:hover{transform:translateY(-1px);box-shadow:0 9px 25px rgba(0,0,0,.25)}
    .history-label{margin:22px 8px 9px;color:#66666e;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.9px}
    .history{flex:1;overflow:auto}
    .history::-webkit-scrollbar{width:6px}.history::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:10px}
    .chat-item{width:100%;padding:11px 12px;margin-bottom:5px;border:1px solid transparent;border-radius:12px;
      background:transparent;color:#d7d7db;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:.16s ease}
    .chat-item:hover{background:rgba(255,255,255,.05)}.chat-item.active{background:rgba(255,255,255,.075);border-color:var(--border)}
    .side-foot{padding-top:10px;border-top:1px solid var(--border);color:#66666e;font-size:11px;text-align:center}
    .main{min-width:0;flex:1;display:flex;flex-direction:column}
    header{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;
      border-bottom:1px solid var(--border);background:rgba(12,12,14,.62)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:14px;background:#fff;color:#000;
      font-weight:950;letter-spacing:-1px;box-shadow:0 0 28px rgba(255,255,255,.11)}
    .brand h1{margin:0;font-size:18px;line-height:1.05;letter-spacing:-.4px}
    .status{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--muted);font-size:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:#79d98c;box-shadow:0 0 10px rgba(121,217,140,.7)}
    .top-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;
      background:rgba(255,255,255,.025);color:#d7d7db;font-size:16px;transition:.18s ease}
    .icon-btn:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}
    .mobile-new{display:none}
    #chat{flex:1;min-height:0;overflow:auto;padding:28px clamp(16px,5vw,70px);scroll-behavior:smooth}
    #chat::-webkit-scrollbar{width:9px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
    .welcome{max-width:700px;margin:10vh auto 34px;text-align:center}
    .welcome-badge{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid var(--border);
      border-radius:20px;background:linear-gradient(145deg,#1c1c21,#0d0d10);font-size:25px;font-weight:950;
      box-shadow:0 15px 50px rgba(0,0,0,.28)}
    .welcome h2{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px}
    .welcome p{margin:10px auto 0;max-width:560px;color:var(--muted);line-height:1.6;font-size:14px}
    .msg-wrap{display:flex;max-width:850px;margin:0 auto 16px;animation:messageIn .24s ease both}
    .msg-wrap.user{justify-content:flex-end}.msg-wrap.kyro{justify-content:flex-start}
    .msg{max-width:min(78%,720px);padding:13px 16px;border-radius:19px;line-height:1.62;white-space:pre-wrap;
      word-break:break-word;font-size:14px}
    .msg.user{color:var(--userText);background:var(--user);border-bottom-right-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
    .msg.kyro{color:#e7e7ea;background:var(--kyro);border:1px solid var(--border);border-bottom-left-radius:6px}
    .msg-tools{display:flex;gap:5px;margin:5px 3px 0}
    .tool-btn{border:0;background:transparent;color:#66666e;font-size:11px;padding:3px 5px;border-radius:6px}
    .tool-btn:hover{color:#d5d5da;background:rgba(255,255,255,.05)}
    .typing{display:inline-flex;align-items:center;gap:6px;padding:14px 16px}
    .typing span{width:6px;height:6px;border-radius:50%;background:#aaaab1;animation:bounce 1.15s infinite ease-in-out}
    .typing span:nth-child(2){animation-delay:.12s}.typing span:nth-child(3){animation-delay:.24s}
    form{padding:14px 16px 17px;border-top:1px solid var(--border);background:rgba(10,10,12,.72)}
    .composer{width:min(850px,100%);margin:0 auto;display:flex;align-items:center;gap:9px;padding:8px;
      border:1px solid var(--border);border-radius:18px;background:#0e0e11;box-shadow:0 10px 35px rgba(0,0,0,.2)}
    input{min-width:0;flex:1;border:0;outline:none;padding:11px 12px;color:#fff;background:transparent}
    input::placeholder{color:#66666e}
    .send{height:40px;padding:0 17px;border:0;border-radius:13px;background:#fff;color:#000;font-weight:850;transition:.18s ease}
    .send:hover:not(:disabled){transform:translateY(-1px)}.send:disabled{opacity:.45;cursor:wait}
    .hint{width:min(850px,100%);margin:8px auto 0;text-align:center;color:#5f5f67;font-size:11px}
    @keyframes messageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
    @media(max-width:850px){
      .sidebar{width:220px;flex-basis:220px}
      .msg{max-width:86%}
    }
    @media(max-width:700px){
      body{overflow:hidden}.shell{width:100vw;height:100vh;min-height:100svh;margin:0;border:0;border-radius:0}
      .sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:280px;transform:translateX(-105%);
        box-shadow:25px 0 70px rgba(0,0,0,.5);transition:transform .22s ease}
      .sidebar.open{transform:translateX(0)}
      .main{width:100%}.mobile-new{display:block}
      header{height:68px;flex-basis:68px;padding:12px 14px}.logo{width:40px;height:40px;flex-basis:40px}
      .top-actions{gap:6px}.icon-btn{width:38px;height:38px}
      #chat{padding:20px 12px 22px}.welcome{margin:6vh auto 28px;padding:0 10px}.welcome h2{font-size:30px}
      .welcome p{font-size:13px}.msg{max-width:88%;font-size:13px}
      form{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.composer{border-radius:16px}
      input{padding:10px 8px}.send{padding:0 14px}.hint{display:none}
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="history-label">Your chats</div>
      <div class="history" id="historyList"></div>
      <div class="side-foot">KYRO · Personal AI</div>
    </aside>

    <section class="main">
      <header>
        <div class="brand">
          <button class="icon-btn mobile-new" id="menuBtn" type="button" aria-label="Open chats">☰</button>
          <div class="logo">K</div>
          <div>
            <h1>KYRO</h1>
            <div class="status"><span class="dot"></span> Online · Personal AI</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="clear" type="button" title="Clear current chat" aria-label="Clear current chat">⌫</button>
        </div>
      </header>

      <section id="chat"></section>

      <form id="form">
        <div class="composer">
          <input id="message" autocomplete="off" placeholder="Message KYRO..." maxlength="4000">
          <button class="send" id="send" type="submit">Send</button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line · KYRO can make mistakes.</div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");
    const newChatBtn = document.getElementById("newChat");
    const historyList = document.getElementById("historyList");
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");

    const CHATS_KEY = "kyro_chats_v2";
    const ACTIVE_KEY = "kyro_active_chat_v2";

    let chats = loadChats();
    let activeId = localStorage.getItem(ACTIVE_KEY);

    function uid(){
      return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    }

    function loadChats(){
      try {
        const saved = JSON.parse(localStorage.getItem(CHATS_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch { return []; }
    }

    function persist(){
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
      if(activeId) localStorage.setItem(ACTIVE_KEY, activeId);
    }

    function createChat(){
      const chatObject = { id: uid(), title: "New chat", messages: [], updatedAt: Date.now() };
      chats.unshift(chatObject);
      activeId = chatObject.id;
      persist();
      renderHistory();
      renderMessages();
      sidebar.classList.remove("open");
      input.focus();
    }

    function currentChat(){
      return chats.find(c => c.id === activeId);
    }

    function ensureChat(){
      if(!currentChat()) createChat();
    }

    function titleFrom(text){
      const clean = text.replace(/\s+/g, " ").trim();
      return clean.length > 32 ? clean.slice(0,32).trim() + "…" : (clean || "New chat");
    }

    function renderHistory(){
      historyList.innerHTML = "";
      chats.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      if(!chats.length){
        const empty = document.createElement("div");
        empty.textContent = "No chats yet.";
        empty.style.cssText = "padding:12px 8px;color:#66666e;font-size:12px;";
        historyList.appendChild(empty);
        return;
      }

      chats.forEach(c => {
        const button = document.createElement("button");
        button.className = "chat-item" + (c.id === activeId ? " active" : "");
        button.textContent = c.title || "New chat";
        button.title = c.title || "New chat";
        button.type = "button";
        button.addEventListener("click", () => {
          activeId = c.id;
          persist();
          renderHistory();
          renderMessages();
          sidebar.classList.remove("open");
          input.focus();
        });
        historyList.appendChild(button);
      });
    }

    function createMessage(text, type, animate){
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap " + type;
      if(!animate) wrap.style.animation = "none";

      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      wrap.appendChild(div);

      if(type === "kyro" && text){
        const tools = document.createElement("div");
        tools.className = "msg-tools";

        const copy = document.createElement("button");
        copy.className = "tool-btn";
        copy.type = "button";
        copy.textContent = "Copy";
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(text);
            copy.textContent = "Copied";
            setTimeout(() => copy.textContent = "Copy", 1200);
          } catch {}
        };

        tools.appendChild(copy);
        div.appendChild(tools);
      }

      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function showWelcome(){
      const welcome = document.createElement("div");
      welcome.className = "welcome";

      const badge = document.createElement("div");
      badge.className = "welcome-badge";
      badge.textContent = "K";

      const title = document.createElement("h2");
      title.textContent = "What are we building today?";

      const p = document.createElement("p");
      p.textContent = "Talk to KYRO, your personal AI assistant for ideas, coding, projects, learning, and whatever comes next.";

      welcome.append(badge, title, p);
      chat.appendChild(welcome);
    }

    function renderMessages(){
      chat.innerHTML = "";
      const c = currentChat();

      if(!c || !c.messages.length){
        showWelcome();
        return;
      }

      c.messages.forEach(m => createMessage(m.text, m.type, false));
      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping(){
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap kyro";
      wrap.id = "typing";

      const div = document.createElement("div");
      div.className = "msg kyro typing";
      div.innerHTML = "<span></span><span></span><span></span>";

      wrap.appendChild(div);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping(){
      document.getElementById("typing")?.remove();
    }

    function addStoredMessage(text, type){
      const c = currentChat();
      if(!c) return;
      c.messages.push({text, type});
      c.updatedAt = Date.now();

      if(type === "user" && c.title === "New chat"){
        c.title = titleFrom(text);
      }

      persist();
      renderHistory();
    }

    function addVisibleMessage(text, type){
      createMessage(text, type, true);
    }

    newChatBtn.addEventListener("click", createChat);

    clear.addEventListener("click", () => {
      const c = currentChat();
      if(!c || !c.messages.length) return;
      c.messages = [];
      c.title = "New chat";
      c.updatedAt = Date.now();
      persist();
      renderHistory();
      renderMessages();
      input.focus();
    });

    menuBtn.addEventListener("click", () => sidebar.classList.toggle("open"));

    input.addEventListener("keydown", event => {
      if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const message = input.value.trim();
      if(!message || send.disabled) return;

      ensureChat();
      const existingWelcome = chat.querySelector(".welcome");
      if(existingWelcome) existingWelcome.remove();

      addVisibleMessage(message, "user");
      addStoredMessage(message, "user");

      input.value = "";
      send.disabled = true;
      send.textContent = "…";
      addTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({message})
        });

        const data = await res.json();
        removeTyping();

        if(!res.ok) throw new Error(data.error || "Something went wrong.");

        addVisibleMessage(data.reply, "kyro");
        addStoredMessage(data.reply, "kyro");
      } catch(error) {
        removeTyping();
        const errorMessage = "Error: " + error.message;
        addVisibleMessage(errorMessage, "kyro");
        addStoredMessage(errorMessage, "kyro");
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });

    if(!activeId || !chats.some(c => c.id === activeId)){
      if(chats.length) activeId = chats[0].id;
      else createChat();
    }

    persist();
    renderHistory();
    renderMessages();
  </script>
</body>
</html>
