<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYRO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #090909;
      color: #f5f5f5;
      display: grid;
      place-items: center;
    }
    .app {
      width: min(900px, 94vw);
      height: min(760px, 90vh);
      border: 1px solid #252525;
      border-radius: 24px;
      background: #101010;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
    }
    header {
      padding: 22px 26px;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
      font-weight: 900;
      font-size: 18px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 3px 0 0; color: #888; font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }
    .msg {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 17px;
      margin-bottom: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      margin-left: auto;
      background: #fff;
      color: #111;
      border-bottom-right-radius: 5px;
    }
    .kyro {
      background: #191919;
      border: 1px solid #292929;
      border-bottom-left-radius: 5px;
    }
    form {
      padding: 18px;
      border-top: 1px solid #242424;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      background: #181818;
      color: white;
      border: 1px solid #2c2c2c;
      border-radius: 14px;
      padding: 14px 16px;
      outline: none;
    }
    input:focus { border-color: #555; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 0 20px;
      background: #fff;
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">K</div>
      <div>
        <h1>KYRO</h1>
        <p>Your personal AI assistant</p>
      </div>
    </header>

    <section id="chat">
      <div class="msg kyro">Yo 👋 I'm KYRO. Let's build something.</div>
    </section>

    <form id="form">
      <input id="message" autocomplete="off" placeholder="Talk to KYRO..." />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message})
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(errorText || "Something went wrong.");
        }

        const div = document.createElement("div");
        div.className = "msg kyro";
        chat.appendChild(div);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let reply = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          reply += decoder.decode(value, { stream: true });
          div.textContent = reply;
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (error) {
        addMessage("Error: " + error.message, "kyro");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
